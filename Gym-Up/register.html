<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Gym Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-container" style="max-width: 500px;">
        <div class="auth-header">
            <h1>Join Squad</h1>
            <p>Create profile to get personalized plan.</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-input" placeholder="e.g. IronMan" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" class="form-input">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" class="form-input" placeholder="25" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" class="form-input" placeholder="175" required>
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" class="form-input" placeholder="70" required>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

            <div class="form-group">
                <label>Fitness Goal</label>
                <select id="goal" class="form-input">
                    <option value="maintain">Maintain Weight</option>
                    <option value="bulk">Bulk (Gain Muscle)</option>
                    <option value="cut">Cut (Lose Fat)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Activity Level</label>
                <select id="activity_level" class="form-input">
                    <option value="sedentary">Sedentary (Office Job)</option>
                    <option value="light">Lightly Active (1-2 days/week)</option>
                    <option value="moderate">Moderate (3-5 days/week)</option>
                    <option value="active">Active (6-7 days/week)</option>
                    <option value="very_active">Very Active (Physical Job)</option>
                </select>
            </div>

            <button type="submit" id="register-btn" class="auth-btn">Create Account</button>
        </form>

        <div class="auth-footer">
            Already a member? <a href="login.html" class="auth-link">Log In</a>
        </div>
    </div>

    <div id="custom-alert" class="alert-overlay">
        <div class="alert-box">
            <h3 id="alert-title" style="color: var(--primary-gold); margin-bottom: 10px;">Alert</h3>
            <p id="alert-message" style="color: #ccc; font-size: 0.9rem;">Message here</p>
            <button class="alert-btn" onclick="document.getElementById('custom-alert').style.display='none'">OK</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
